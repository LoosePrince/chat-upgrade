// Standalone offline compile-verification harness for the Fabric 26.1 path.
// Not part of the Stonecutter build; uses only locally cached artifacts (run with --offline).
pluginManagement {
    repositories {
        maven { url 'https://maven.fabricmc.net/' }
        mavenCentral()
        gradlePluginPortal()
    }
}
rootProject.name = 'verify-fabric-261'
