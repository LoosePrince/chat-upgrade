// Offline compile check: compiles src/common + src/fabric against the cached MC 26.1 Fabric toolchain.
buildscript {
    repositories {
        maven { url 'https://maven.fabricmc.net/' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'net.fabricmc:fabric-loom:1.15.5'
    }
}

apply plugin: 'fabric-loom'

def repoRoot = file('../..')

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft 'com.mojang:minecraft:26.1'
    // 26.1 ships unobfuscated; empty layered mappings satisfy Loom 1.15.5 without a download.
    mappings loom.layered {}
    implementation 'net.fabricmc:fabric-loader:0.18.6'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.145.1+26.1'

    // Compile-time libraries used by the common sources.
    implementation 'com.twelvemonkeys.common:common-lang:3.12.0'
    implementation 'com.twelvemonkeys.common:common-io:3.12.0'
    implementation 'com.twelvemonkeys.common:common-image:3.12.0'
    implementation 'com.twelvemonkeys.imageio:imageio-core:3.12.0'
    implementation 'com.twelvemonkeys.imageio:imageio-metadata:3.12.0'
    implementation 'com.twelvemonkeys.imageio:imageio-jpeg:3.12.0'
    implementation 'com.twelvemonkeys.imageio:imageio-webp:3.12.0'
    implementation 'org.apache.commons:commons-imaging:1.0.0-alpha5'
    implementation 'org.bytedeco:javacpp:1.5.11'
    implementation 'org.bytedeco:ffmpeg:7.1-1.5.11'
}

sourceSets {
    main {
        java {
            srcDirs = [
                new File(repoRoot, 'src/common/src/main/java'),
                new File(repoRoot, 'src/fabric/src/main/java')
            ]
        }
        resources {
            srcDirs = []
        }
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}
