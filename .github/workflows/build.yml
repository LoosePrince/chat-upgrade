# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/

  release:
    runs-on: ubuntu-24.04
    needs: build
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build release artifact
        run: ./gradlew build
      - name: check version changed
        id: version_changed
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -Fxq "gradle.properties"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          diff_content="$(git diff -U0 "${{ github.event.before }}" "${{ github.sha }}" -- gradle.properties)"
          if printf '%s' "$diff_content" | grep -Eq "^[+-](minecraft_version|mod_version)="; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: compute release metadata
        id: meta
        if: steps.version_changed.outputs.changed == 'true'
        shell: bash
        run: |
          minecraft_version="$(awk -F= '/^minecraft_version=/{print $2}' gradle.properties)"
          mod_version="$(awk -F= '/^mod_version=/{print $2}' gradle.properties)"
          tag="v${minecraft_version}_fabric-${mod_version}"
          title="${minecraft_version}_fabric-${mod_version}"
          prev_tag="$(git tag --list 'v*_fabric-*' --sort=-v:refname | awk -v t="$tag" '$0 != t { print; exit }')"
          body_file="$RUNNER_TEMP/release_body.md"
          if [[ -n "$prev_tag" ]]; then
            git log --pretty='- %s (%H)' "${prev_tag}..HEAD" > "$body_file"
          else
            git log --pretty='- %s (%H)' > "$body_file"
          fi

          asset_file=""
          for jar in build/libs/*.jar; do
            if [[ "$jar" != *-sources.jar ]]; then
              asset_file="$jar"
              break
            fi
          done
          if [[ -z "$asset_file" ]]; then
            echo "No release jar found (excluding -sources)." >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "body_file=$body_file" >> "$GITHUB_OUTPUT"
          echo "asset_file=$asset_file" >> "$GITHUB_OUTPUT"
      - name: create or update github release
        if: steps.version_changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_TITLE: ${{ steps.meta.outputs.title }}
          RELEASE_BODY_FILE: ${{ steps.meta.outputs.body_file }}
          RELEASE_ASSET_FILE: ${{ steps.meta.outputs.asset_file }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes-file "$RELEASE_BODY_FILE"
            while IFS= read -r asset_name; do
              if [[ "$asset_name" == *.jar && "$asset_name" != *-sources.jar ]]; then
                gh release delete-asset "$RELEASE_TAG" "$asset_name" --yes
              fi
            done < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
            gh release upload "$RELEASE_TAG" "$RELEASE_ASSET_FILE" --clobber
          else
            gh release create "$RELEASE_TAG" "$RELEASE_ASSET_FILE" --title "$RELEASE_TITLE" --notes-file "$RELEASE_BODY_FILE"
          fi
