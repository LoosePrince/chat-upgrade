plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	mavenCentral()
}

def embedFfmpegNatives = (findProperty("embedFfmpegNatives") ?: "true").toString().toBoolean()

loom {
	splitEnvironmentSourceSets()

	mods {
		"chat-upgrade" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	// Loom runClient often passes -Djava.awt.headless=true; override so AWT dialogs / clipboard can work.
	runs {
		client {
			vmArg("-Djava.awt.headless=false")
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// WebP via ImageIO SPI (nested in mod jar for release)
	include(implementation("com.twelvemonkeys.common:common-lang:3.12.0"))
	include(implementation("com.twelvemonkeys.common:common-io:3.12.0"))
	include(implementation("com.twelvemonkeys.common:common-image:3.12.0"))
	include(implementation("com.twelvemonkeys.imageio:imageio-core:3.12.0"))
	include(implementation("com.twelvemonkeys.imageio:imageio-metadata:3.12.0"))
	include(implementation("com.twelvemonkeys.imageio:imageio-webp:3.12.0"))

	// Video decode support (JavaCPP FFmpeg)
	// Always include Java wrappers; natives can be embedded or downloaded on demand.
	include(implementation("org.bytedeco:javacpp:1.5.11"))
	include(implementation("org.bytedeco:ffmpeg:7.1-1.5.11"))
	if (embedFfmpegNatives) {
		// Full-platform embedded natives build.
		include(implementation("org.bytedeco:javacpp:1.5.11:windows-x86_64"))
		include(implementation("org.bytedeco:ffmpeg:7.1-1.5.11:windows-x86_64"))
		include(implementation("org.bytedeco:javacpp:1.5.11:linux-x86_64"))
		include(implementation("org.bytedeco:ffmpeg:7.1-1.5.11:linux-x86_64"))
		include(implementation("org.bytedeco:javacpp:1.5.11:linux-arm64"))
		include(implementation("org.bytedeco:ffmpeg:7.1-1.5.11:linux-arm64"))
		include(implementation("org.bytedeco:javacpp:1.5.11:macosx-x86_64"))
		include(implementation("org.bytedeco:ffmpeg:7.1-1.5.11:macosx-x86_64"))
		include(implementation("org.bytedeco:javacpp:1.5.11:macosx-arm64"))
		include(implementation("org.bytedeco:ffmpeg:7.1-1.5.11:macosx-arm64"))
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "projectName", project.name
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}