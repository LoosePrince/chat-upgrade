# Root gradle.properties: global Gradle settings + mod metadata.
# Per-target dependency versions live in gradle/targets/<version>.properties and are
# seeded into versions/<version>-<loader>/gradle.properties by settings.gradle.kts.

# Gradle
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.caching=true
# Loom is not yet compatible with the configuration cache.
org.gradle.configuration-cache=false

# Mod metadata
mod.id=chatupgrade
mod.name=Chat Upgrade
mod.version=2.0.0
mod.group=com.chat.upgrade

# [VERSIONED] placeholders — overridden per target by versions/<target>/gradle.properties
mod.mc_title=[VERSIONED]
mod.mc_targets=[VERSIONED]
mod.java_version=25
dep.minecraft.fabric=[VERSIONED]
dep.minecraft.neoforge=[VERSIONED]
dep.minecraft_range_nf=[VERSIONED]
dep.fabric_loader=[VERSIONED]
dep.fabric_api_version=[VERSIONED]
dep.neoforge_loader=[VERSIONED]
dep.neoforge_loader_range=[VERSIONED]
dep.neoforge_version_range=[VERSIONED]
